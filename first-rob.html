/* =========================
   基础
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#000;
    color:#fff;
    font-family:
        system-ui,
        -apple-system,
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

    overflow-x:hidden;
}


/* =========================
   返回区域
========================= */

.top-bar{
    width:100%;
    padding:25px 32px;
}

.breadcrumb{
    font-size:10px;
    color:#555;
    letter-spacing:.12em;
    margin-bottom:13px;
}

.back-btn{
    display:inline-block;

    color:#888;
    text-decoration:none;

    font-size:12px;

    transition:.3s;
}

.back-btn:hover{
    color:#fff;
}


/* =========================
   页面
========================= */

.container{
    width:100%;
    padding:55px 0 100px;
}


/* =========================
   标题
========================= */

.title-area{
    text-align:center;
    padding:0 20px;
}

.series-label{
    font-size:10px;
    color:#555;
    letter-spacing:.16em;

    margin-bottom:25px;
}

.big-title{
    font-size:clamp(65px,8vw,125px);
    font-weight:400;

    line-height:.95;
    letter-spacing:.08em;

    margin-bottom:30px;
}

.intro{
    max-width:700px;

    margin:0 auto;

    color:#888;

    font-size:14px;
    line-height:2;
}


/* =========================
   轮播展示区
========================= */

.slider-section{
    width:100%;

    margin-top:65px;

    position:relative;

    overflow:hidden;
}


/* 图片轨道 */

.slider-track{
    display:flex;
    align-items:center;

    gap:28px;

    transition:
        transform .75s
        cubic-bezier(.22,1,.36,1);

    will-change:transform;
}


/* =========================
   单张图片
========================= */

.slide{
    flex:0 0 clamp(230px,25vw,390px);

    height:480px;

    border-radius:22px;

    overflow:hidden;

    background:#111;

    cursor:pointer;

    position:relative;

    opacity:.35;

    transform:scale(.82);

    transition:
        transform .65s cubic-bezier(.22,1,.36,1),
        opacity .5s ease,
        filter .5s ease;
}


/* 图片 */

.slide img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    transition:
        transform .7s cubic-bezier(.22,1,.36,1);
}


/* 当前图片 */

.slide.active{
    opacity:1;

    transform:scale(1);

    z-index:5;
}


/* 当前图片轻微放大 */

.slide.active:hover img{
    transform:scale(1.025);
}


/* 左右相邻图片 */

.slide.near{
    opacity:.65;

    transform:scale(.9);
}


/* =========================
   左右按钮
========================= */

.slider-arrow{
    position:absolute;

    top:50%;

    width:48px;
    height:48px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.25);

    background:rgba(0,0,0,.45);

    backdrop-filter:blur(10px);

    color:#fff;

    font-size:19px;

    cursor:pointer;

    z-index:20;

    transform:translateY(-50%);

    transition:.3s;
}

.slider-arrow:hover{
    background:#fff;
    color:#000;
}

.slider-arrow.prev{
    left:35px;
}

.slider-arrow.next{
    right:35px;
}


/* =========================
   小圆点
========================= */

.dots{
    display:flex;

    justify-content:center;
    align-items:center;

    gap:10px;

    margin-top:45px;
}


.dot{
    width:6px;
    height:6px;

    border:0;

    padding:0;

    border-radius:50%;

    background:#444;

    cursor:pointer;

    transition:
        width .35s ease,
        background .35s ease,
        transform .35s ease;
}


/* 当前状态 */

.dot.active{
    width:22px;

    border-radius:20px;

    background:#fff;
}


/* =========================
   当前页码
========================= */

.counter{
    margin-top:18px;

    text-align:center;

    font-size:10px;

    letter-spacing:.15em;

    color:#555;
}


/* =========================
   底部
========================= */

.footer{
    width:min(1100px,90vw);

    margin:100px auto 0;

    padding-top:25px;

    border-top:1px solid #222;

    display:flex;

    justify-content:space-between;

    color:#555;

    font-size:10px;

    letter-spacing:.1em;
}


/* =========================
   手机
========================= */

@media(max-width:700px){

    .top-bar{
        padding:20px;
    }

    .container{
        padding-top:40px;
    }

    .big-title{
        font-size:50px;
    }

    .intro{
        font-size:13px;
        padding:0 15px;
    }

    .slider-section{
        margin-top:50px;
    }

    .slider-track{
        gap:16px;
    }

    .slide{
        flex-basis:75vw;
        height:430px;
    }

    .slider-arrow{
        width:40px;
        height:40px;
    }

    .slider-arrow.prev{
        left:12px;
    }

    .slider-arrow.next{
        right:12px;
    }

}

</style>
